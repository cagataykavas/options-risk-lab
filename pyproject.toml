[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optirisk"
version = "0.1.0"
description = "Dependency-free European option pricing and static-arbitrage risk checks"
requires-python = ">=3.11"

[project.scripts]
optirisk-audit = "optirisk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
