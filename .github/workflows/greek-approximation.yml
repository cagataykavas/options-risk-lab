name: Greek approximation envelope

on:
  pull_request:
    paths:
      - "optirisk/approximation_audit.py"
      - "tests/test_approximation_audit.py"
      - "docs/greek_approximation_envelope.md"
      - ".github/workflows/greek-approximation.yml"
  push:
    branches: [main]
    paths:
      - "optirisk/approximation_audit.py"
      - "tests/test_approximation_audit.py"
      - "docs/greek_approximation_envelope.md"
      - ".github/workflows/greek-approximation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 ruff==0.17.5
      - run: ruff check optirisk/approximation_audit.py tests/test_approximation_audit.py
      - run: python -m compileall -q optirisk/approximation_audit.py tests/test_approximation_audit.py
      - run: python -m pytest -q tests/test_approximation_audit.py
