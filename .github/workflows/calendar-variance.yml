name: calendar-variance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff==0.12.11
      - run: ruff check optirisk/calendar_variance.py tests/test_calendar_variance.py
      - run: ruff format --check optirisk/calendar_variance.py tests/test_calendar_variance.py
      - run: python -m unittest discover -s tests -p 'test_calendar_variance.py'
      - run: python -m compileall -q optirisk tests
